[package]
name = "dafar"
version = "0.2.2"
description = "Da far – Aufgaben in farbigen Kacheln"
edition = "2021"

[lib]
name = "dafar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
