# Baut Kachelkalender für alle Geräte, sobald die Versionsnummer in src-tauri/tauri.conf.json steigt,
# und legt die Dateien unter «Releases» (Tag v<Version>) ab. Obtainium holt sich dort die Handy-Updates.
name: App bauen

on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: write

# Kommt eine neuere Version, wird ein noch laufender älterer Bau abgebrochen
concurrency:
  group: app-bauen
  cancel-in-progress: true

jobs:
  # Zuerst automatisch durch die App tippen. Schlägt etwas fehl, wird nichts gebaut.
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Automatische Prüfung
        run: npm test

  desktop:
    needs: pruefen
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux-Bibliotheken
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kachelkalender v__VERSION__"
          releaseBody: "Handy (iodéOS/Android): .apk – am einfachsten über Obtainium. Mac: .dmg · Windows: .exe · Linux: .AppImage oder .deb"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Handy-Version läuft gleichzeitig mit den Computer-Versionen, damit die APK schnell da ist
  android:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version lesen
        run: echo "APP_VERSION=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK/NDK (auf dem Bau-Computer vorinstalliert)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}  NDK: $ANDROID_NDK_LATEST_HOME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npx tauri android init --ci
      - name: Mikrofon-Recht fürs Handy (Spracheingabe, nur auf Knopfdruck)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -n "permission" "$M"
      - name: Tastatur schiebt das Fenster hoch (Speichern bleibt sichtbar)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q windowSoftInputMode "$M" && sed -i 's#android:windowSoftInputMode="[^"]*"#android:windowSoftInputMode="adjustResize"#' "$M" || sed -i '0,/<activity/s#<activity#<activity android:windowSoftInputMode="adjustResize"#' "$M"
          grep -n "windowSoftInputMode" "$M"
      - name: Startbildschirm-Widget
        run: node scripts/android-widget.mjs
      - name: App-Symbol fürs Handy
        run: npx tauri icon scripts/icon.png
      - name: Handy-Symbol mit dunklem Hintergrund (wie das Logo in der App)
        run: |
          find src-tauri -name ic_launcher_background.xml -print -exec sed -i 's/#[0-9A-Fa-f]\{6\}/#2E3035/' {} \;
      - name: Signatur-Passwort vorhanden?
        id: key
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_PASSWORD" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::Secret ANDROID_KEY_PASSWORD fehlt – Handy-Version wird übersprungen"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: App signieren (gleicher Schlüssel für jedes Update)
        if: steps.key.outputs.ok == 'true'
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/kachelkalender.jks.enc -out "$RUNNER_TEMP/kachelkalender.jks" -pass env:ANDROID_KEY_PASSWORD
          printf "keyAlias=kachelkalender\npassword=%s\nstoreFile=%s\n" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/kachelkalender.jks" > src-tauri/gen/android/keystore.properties
          node scripts/android-signing.mjs
      - run: npx tauri android build --apk --target aarch64 --target armv7
        if: steps.key.outputs.ok == 'true'
      - name: Datei benennen
        if: steps.key.outputs.ok == 'true'
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Kachelkalender-${APP_VERSION}.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.ok == 'true'
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Kachelkalender ${{ env.APP_VERSION }}"
          files: Kachelkalender-*.apk
